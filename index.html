<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07110c">
  <meta name="description" content="AHMED CHAT - محادثاتك في مكان واحد">
  <link rel="manifest" href="./manifest.webmanifest">
  <title>AHMED CHAT</title>
  <style>
    :root { color-scheme: dark; --bg:#07110c; --panel:#101b14; --panel2:#14231a; --green:#20d879; --green2:#11a85a; --muted:#9aada1; --line:#26382c; }
    * { box-sizing:border-box }
    body { margin:0; min-height:100vh; background:radial-gradient(ellipse at top,#102719 0,#07110c 55%); color:#f2fff6; font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif; }
    button,input { font:inherit }
    .shell { width:min(760px,100%); min-height:100vh; margin:auto; padding:22px 16px 30px; display:flex; flex-direction:column; }
    header { display:flex; align-items:center; gap:12px; padding:8px 2px 20px; }
    .logo { width:46px;height:46px;border-radius:15px;background:linear-gradient(145deg,#29ef87,#08763c);display:grid;place-items:center;color:#03160b;font-weight:1000;font-size:22px;box-shadow:0 8px 30px #0ab65a33; }
    h1 { font-size:20px; margin:0; letter-spacing:1.4px; } .tag { color:var(--muted);font-size:12px;margin-top:3px }
    .status { margin-inline-start:auto; font-size:11px;color:var(--green);border:1px solid #1a7042;padding:6px 10px;border-radius:99px }
    .card { background:linear-gradient(160deg,#132219,#0d1711); border:1px solid var(--line); border-radius:22px; box-shadow:0 18px 50px #0005; }
    .auth { width:min(440px,100%); margin:5vh auto; padding:24px; }
    .auth h2 { margin:0 0 8px;font-size:23px }
    .sub { color:var(--muted);font-size:14px;line-height:1.7;margin:0 0 22px }
    label { display:block;font-size:13px;color:#c7d8cc;margin:14px 0 7px }
    input { width:100%;background:#08120c;border:1px solid #304638;color:#fff;padding:14px 13px;border-radius:12px;outline:none; }
    input:focus { border-color:var(--green);box-shadow:0 0 0 3px #20d87920 }
    .btn { border:0;border-radius:12px;padding:13px 17px;font-weight:750;cursor:pointer; }
    .primary { width:100%;margin-top:18px;background:linear-gradient(100deg,var(--green),#10b65d);color:#04150b; }
    .secondary { background:#1b2b20;color:#dfffea;border:1px solid #355340; }
    .linkbtn { background:none;border:0;color:var(--green);padding:12px 4px;cursor:pointer }
    .msg { min-height:22px;color:#ffcb82;font-size:13px;margin-top:10px;line-height:1.5 }
    .chat { display:none;flex:1;min-height:65vh;overflow:hidden;flex-direction:column; }
    .chathead { display:flex;align-items:center;gap:10px;padding:16px;border-bottom:1px solid var(--line) }
    .roomdot { width:10px;height:10px;border-radius:50%;background:var(--green);box-shadow:0 0 14px var(--green) }
    .roomtitle { font-weight:800 }
    .userline { color:var(--muted);font-size:12px;margin-top:3px;direction:ltr;text-align:right }
    .logout { margin-inline-start:auto;padding:9px 12px;font-size:12px }
    .messages { flex:1;min-height:360px;max-height:60vh;overflow-y:auto;padding:18px 14px;display:flex;flex-direction:column;gap:12px; }
    .empty { margin:auto;color:var(--muted);text-align:center;line-height:1.8;font-size:14px }
    .bubble { max-width:85%;align-self:flex-start;background:#1b2c21;border:1px solid #2b4935;border-radius:16px 16px 16px 4px;padding:10px 13px;overflow-wrap:anywhere; }
    .bubble.mine { align-self:flex-end;background:linear-gradient(145deg,#0d7944,#09542f);border-color:#16834b;border-radius:16px 16px 4px 16px; }
    .sender { color:#8df0b7;font-size:11px;margin-bottom:5px;direction:ltr;text-align:right }
    .bodytext { white-space:pre-wrap;line-height:1.55;font-size:14px }
    .time { color:#b8d2c0aa;font-size:10px;margin-top:6px }
    .composer { display:flex;gap:9px;padding:13px;border-top:1px solid var(--line);background:#0d1811 }
    .composer input { flex:1;min-width:0;border-radius:99px;padding-inline:17px }
    .send { width:48px;flex:0 0 48px;border-radius:50%;background:var(--green);color:#04150b;font-size:20px;padding:0 }
    .foot { text-align:center;color:#718579;font-size:11px;padding:15px 0 0 }
    @media (max-width:480px) { .shell{padding:14px 10px 22px}.auth{padding:20px}.messages{padding:14px 10px}.chat{min-height:72vh} }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div class="logo">A</div>
      <div><h1>AHMED CHAT</h1><div class="tag">تواصل بسهولة • في أي وقت</div></div>
      <div class="status">● متصل</div>
    </header>

    <section id="authPanel" class="card auth">
      <h2 id="authTitle">أهلاً بيك 👋</h2>
      <p class="sub" id="authSubtitle">سجّل دخولك أو أنشئ حسابًا جديدًا لبدء المحادثة.</p>
      <form id="authForm">
        <label for="email">البريد الإلكتروني</label>
        <input id="email" type="email" autocomplete="email" placeholder="name@example.com" required>
        <label for="password">كلمة المرور</label>
        <input id="password" type="password" autocomplete="current-password" minlength="6" placeholder="6 أحرف على الأقل" required>
        <button id="submitAuth" class="btn primary" type="submit">تسجيل الدخول</button>
      </form>
      <div style="text-align:center">
        <button id="toggleAuth" class="linkbtn" type="button">ليس لديك حساب؟ أنشئ حسابًا</button>
      </div>
      <div id="authMsg" class="msg" role="status"></div>
    </section>

    <section id="chatPanel" class="card chat">
      <div class="chathead">
        <span class="roomdot"></span>
        <div><div class="roomtitle">الغرفة العامة</div><div id="currentUser" class="userline"></div></div>
        <button id="logout" class="btn secondary logout" type="button">تسجيل الخروج</button>
      </div>
      <div id="messages" class="messages" aria-live="polite">
        <div class="empty">أهلًا بيك في AHMED CHAT<br>ابدأ أول رسالة في الغرفة 👋</div>
      </div>
      <form id="sendForm" class="composer">
        <input id="messageInput" maxlength="1000" placeholder="اكتب رسالتك..." autocomplete="off" required>
        <button class="btn send" type="submit" aria-label="إرسال">➤</button>
      </form>
    </section>
    <div class="foot">Developed by Ahmed Mohamed</div>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, query, orderBy, limit, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCUJHV3ntrEwxBpdAGkm38vHAiGffFbwQo",
      authDomain: "ahmed-chat-f0bb0.firebaseapp.com",
      projectId: "ahmed-chat-f0bb0",
      storageBucket: "ahmed-chat-f0bb0.firebasestorage.app",
      messagingSenderId: "754138325667",
      appId: "1:754138325667:web:374028319032512147d516",
      measurementId: "G-P9XD9LPB99"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const $ = (id) => document.getElementById(id);
    let createMode = false;
    let stopMessages = null;

    $("toggleAuth").addEventListener("click", () => {
      createMode = !createMode;
      $("authTitle").textContent = createMode ? "إنشاء حساب جديد" : "أهلاً بيك 👋";
      $("authSubtitle").textContent = createMode ? "استخدم بريدك الإلكتروني وكلمة مرور آمنة." : "سجّل دخولك أو أنشئ حسابًا جديدًا لبدء المحادثة.";
      $("submitAuth").textContent = createMode ? "إنشاء الحساب" : "تسجيل الدخول";
      $("toggleAuth").textContent = createMode ? "لديك حساب بالفعل؟ سجّل الدخول" : "ليس لديك حساب؟ أنشئ حسابًا";
      $("password").setAttribute("autocomplete", createMode ? "new-password" : "current-password");
      $("authMsg").textContent = "";
    });

    $("authForm").addEventListener("submit", async (event) => {
      event.preventDefault();
      $("submitAuth").disabled = true;
      $("authMsg").textContent = "جارٍ الاتصال...";
      try {
        const email = $("email").value.trim();
        const password = $("password").value;
        if (createMode) await createUserWithEmailAndPassword(auth, email, password);
        else await signInWithEmailAndPassword(auth, email, password);
      } catch (error) {
        const messages = {
          "auth/email-already-in-use": "البريد الإلكتروني مستخدم بالفعل.",
          "auth/invalid-email": "صيغة البريد الإلكتروني غير صحيحة.",
          "auth/weak-password": "كلمة المرور ضعيفة؛ استخدم 6 أحرف على الأقل.",
          "auth/invalid-credential": "البريد الإلكتروني أو كلمة المرور غير صحيحة.",
          "auth/network-request-failed": "تعذر الاتصال بالإنترنت. حاول مرة أخرى."
        };
        $("authMsg").textContent = messages[error.code] || "حصل خطأ: " + error.message;
      } finally {
        $("submitAuth").disabled = false;
      }
    });

    $("logout").addEventListener("click", () => signOut(auth));

    function showMessages(snapshot, user) {
      const box = $("messages");
      const wasNearBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 100;
      box.replaceChildren();
      if (snapshot.empty) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "لسه مفيش رسائل. ابدأ المحادثة 👋";
        box.append(empty);
        return;
      }
      snapshot.docs.forEach((docSnap) => {
        const data = docSnap.data();
        const bubble = document.createElement("article");
        bubble.className = "bubble" + (data.senderId === user.uid ? " mine" : "");
        const sender = document.createElement("div");
        sender.className = "sender";
        sender.textContent = data.senderId === user.uid ? "أنت" : "مستخدم";
        const body = document.createElement("div");
        body.className = "bodytext";
        body.textContent = data.text || "";
        const time = document.createElement("div");
        time.className = "time";
        const date = data.createdAt?.toDate?.();
        time.textContent = date ? date.toLocaleString("ar-EG", {hour:"2-digit", minute:"2-digit"}) : "الآن";
        bubble.append(sender, body, time);
        box.append(bubble);
      });
      if (wasNearBottom) box.scrollTop = box.scrollHeight;
    }

    $("sendForm").addEventListener("submit", async (event) => {
      event.preventDefault();
      const user = auth.currentUser;
      const text = $("messageInput").value.trim();
      if (!user || !text) return;
      const sendButton = $("sendForm").querySelector("button");
      sendButton.disabled = true;
      try {
        await addDoc(collection(db, "messages"), {
          senderId: user.uid,
          text,
          createdAt: serverTimestamp()
        });
        $("messageInput").value = "";
      } catch (error) {
        alert("لم يتم إرسال الرسالة. تأكد من نشر قواعد Firestore. " + error.message);
      } finally {
        sendButton.disabled = false;
        $("messageInput").focus();
      }
    });

    onAuthStateChanged(auth, (user) => {
      $("authPanel").style.display = user ? "none" : "block";
      $("chatPanel").style.display = user ? "flex" : "none";
      if (stopMessages) { stopMessages(); stopMessages = null; }
      if (!user) return;
      $("currentUser").textContent = user.email || "";
      const q = query(collection(db, "messages"), orderBy("createdAt", "asc"), limit(100));
      stopMessages = onSnapshot(q, (snapshot) => showMessages(snapshot, user), (error) => {
        $("messages").textContent = "تعذر تحميل الرسائل: " + error.message;
      });
    });

    if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
      navigator.serviceWorker.register("./sw.js").catch(() => {});
    }
  </script>
</body>
</html>
